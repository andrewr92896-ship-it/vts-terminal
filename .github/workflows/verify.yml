name: verify

# Runs exactly the same `npm run verify` a session runs locally, so every branch
# meets the same bar regardless of what the session running it remembered to do.
# If this is red, the branch is not ready to deploy.
#
# NO SECRETS ARE NEEDED HERE, deliberately. scripts/verify.mjs generates its own
# throwaway CREDENTIALS_KEY and SESSION_SECRET, because nothing in the checks
# reads a real credential or a real database. Do not add repository secrets for
# them — there is nothing for a real key to protect in a build, and a real key
# in CI is a real key in a log.

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'

# A branch pushed twice in quick succession only needs the newer run. Several
# branches are usually in flight here, so this keeps them from queueing behind
# runs nobody is waiting on.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run verify
