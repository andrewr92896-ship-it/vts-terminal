function fmtRelative(ms){
  const diff = NOW - ms;
  if (diff < 0) return fmtTime(ms);
  const m = Math.floor(diff/60000);
  if (m < 1) return 'just now';
  if (m < 60) return m+'m ago';
  const h = Math.floor(m/60);
  if (h < 24) return h+'h ago';
  return fmtDayKey(ms);
}

const FEED_PATTERNS=[
 {key:'fed',re:/\b(fed|feds|fomc|federal reserve|jerome powell|powell|rate cut|rate hike|rate decision|interest rate|interest rates|monetary policy|dot plot|beige book)\b/i},
 {key:'btc',re:/\b(bitcoin|btc|crypto|cryptocurrency|ethereum|ether|stablecoin|coinbase|blackrock ibit|spot etf)\b/i},
 {key:'eurusd',re:/\b(eur\/usd|eurusd|euro|euros|eurozone|ecb|european central bank|lagarde|germany|german|france|french)\b/i},
 {key:'gold',re:/\b(gold|xau|bullion|precious metal|precious metals)\b/i},
 {key:'indices',re:/\b(nasdaq|nas100|us100|s&p|s&p 500|sp500|spx|us500|dow jones|djia|us30|russell 2000|russell)\b/i},
];
function newsFeedsOf(item){
  const text=[item.title,item.body,item.source].filter(Boolean).join(' ');
  const keys=new Set();
  for(const{key,re} of FEED_PATTERNS) if(re.test(text)) keys.add(key);
  if((item.source||'').toLowerCase().includes('federal reserve')) keys.add('fed');
  if(item.category==='crypto') keys.add('btc');
  if(keys.size===0) keys.add('markets');
  return [...keys];
}

const FACTOR_KEYWORDS={
 USD:['USD','DOLLAR','GREENBACK','FED','FOMC','FEDERAL RESERVE','POWELL','TREASURY','NONFARM','NFP','US','U S','AMERICA','AMERICAN','UNITED STATES'],
 EUR:['EUR','EURO','EUROZONE','ECB','LAGARDE','GERMANY','GERMAN','FRANCE','FRENCH'],
 GBP:['GBP','POUND','STERLING','BOE','BANK OF ENGLAND','BRITAIN','BRITISH','UK'],
 JPY:['JPY','YEN','BOJ','BANK OF JAPAN','JAPAN','JAPANESE','UEDA'],
 AUD:['AUD','AUSSIE','RBA','AUSTRALIA','AUSTRALIAN'], NZD:['NZD','KIWI','RBNZ','NEW ZEALAND'],
 CAD:['CAD','LOONIE','BOC','BANK OF CANADA','CANADA','CANADIAN'], CHF:['CHF','FRANC','SNB','SWISS','SWITZERLAND'],
 GOLD:['GOLD','XAU','BULLION'], SILVER:['SILVER','XAG'], OIL:['OIL','CRUDE','WTI','BRENT','OPEC'],
 BTC:['BTC','BITCOIN'], ETH:['ETH','ETHER','ETHEREUM'], CRYPTO:['CRYPTO','CRYPTOCURRENCY','DIGITAL ASSET','DIGITAL ASSETS'],
 NASDAQ:['NASDAQ','NAS100','US100'], DOW:['DOW','DJIA','US30'], SP500:['S&P','SP500','US500','SP 500','S P 500'],
 EQUITIES:['STOCKS','EQUITIES','EQUITY','WALL STREET','SHARES'],
};
const DEFAULT_WATCHLIST=['EUR/USD','BTC/USD','XAU/USD','US100','US500','US30','GBP/USD','USD/JPY'];
function instrumentFactors(sym){
  sym=sym.trim().toUpperCase();
  const fx=/^([A-Z]{3})\/([A-Z]{3})$/.exec(sym);
  if(fx){const f=new Set();for(const c of[fx[1],fx[2]]){
    if(c==='XAU')f.add('GOLD');else if(c==='XAG')f.add('SILVER');
    else if(c==='BTC'){f.add('BTC');f.add('CRYPTO');}else if(c==='ETH'){f.add('ETH');f.add('CRYPTO');}
    else f.add(c);} return[...f];}
  if(sym==='US100'||sym==='NAS100')return['NASDAQ','EQUITIES','USD'];
  if(sym==='US30')return['DOW','EQUITIES','USD'];
  if(sym==='US500'||sym==='SPX500'||sym==='SPX')return['SP500','EQUITIES','USD'];
  if(sym.startsWith('BTC'))return['BTC','CRYPTO','USD'];
  if(sym.startsWith('ETH'))return['ETH','CRYPTO','USD'];
  return['EQUITIES','USD'];
}
function affectedInstruments(item,watchlist){
  const hay=' '+[item.title,item.body,item.source].filter(Boolean).join(' ').toUpperCase().replace(/[^A-Z0-9&]+/g,' ')+' ';
  const detected=new Set();
  for(const[f,kws]of Object.entries(FACTOR_KEYWORDS)) if(kws.some(k=>hay.includes(' '+k+' '))) detected.add(f);
  if(item.category==='crypto') detected.add('CRYPTO');
  if(detected.size===0) return[];
  return watchlist.map(s=>({s,n:instrumentFactors(s).filter(f=>detected.has(f)).length}))
                  .filter(x=>x.n>0).sort((a,b)=>b.n-a.n).map(x=>x.s);
}

/* ========================================================================= */
const IMPACT={high:{label:'High',color:'var(--red)'},medium:{label:'Med',color:'var(--amber)'},low:{label:'Low',color:'var(--faint)'}};
const BIAS={bullish:{label:'Bullish',color:'#35c47b',arrow:'▲'},bearish:{label:'Bearish',color:'#ef5468',arrow:'▼'},neutral:{label:'Neutral',color:'#9fb0d6',arrow:'●'}};
const CATEGORY={markets:'Markets',geopolitical:'Geopolitical',economic:'Economic',crypto:'Crypto',other:'Other'};

const state={feed:'all',impact:'medhigh',bias:'all',source:'all'};
const S = id => document.getElementById(id).checked;
const esc = s => String(s).replace(/&(?![#a-zA-Z0-9]+;)/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const txt = s => esc(decodeEntities(s));

function render(){
  const well=document.getElementById('well');
  document.getElementById('shell').className = S('s-phone') ? 'phone' : '';

  if (S('s-load')) { well.innerHTML = '<div class="loading">Loading market news…</div>'; return; }

  const canWrite = !S('s-ro');
  const headlines = S('s-empty') ? [] : HEADLINES;
  const calendar  = S('s-empty') ? [] : CALENDAR;
  const truth     = S('s-empty') ? [] : TRUTH;
  const isNewsTab = state.feed!=='trump' && state.feed!=='calendar';

  /* calendar splits — upcoming keeps anything less than 6h old */
  const split = evs => ({
    upcoming: evs.filter(e=>e.eventTime >= NOW - 6*3600000),
    past:     evs.filter(e=>e.eventTime <  NOW - 6*3600000).reverse(),
  });
  const cal = split(calendar);
  const eurCal = split(calendar.filter(e=>['EUR','USD'].includes((e.country||'').toUpperCase())));
  eurCal.total = calendar.filter(e=>['EUR','USD'].includes((e.country||'').toUpperCase())).length;

  /* tab counts */
  const counts={all:headlines.length,trump:truth.length,calendar:calendar.length};
  for(const f of NEWS_FEEDS) counts[f.key]=0;
  for(const h of headlines) for(const k of newsFeedsOf(h)) counts[k]=(counts[k]||0)+1;
  counts.eurusd=(counts.eurusd||0)+eurCal.total;

  const tabs=[{key:'all',label:'All'},{key:'trump',label:'Trump'},...NEWS_FEEDS,{key:'calendar',label:'Calendar'}];

  const feedHeadlines = isNewsTab ? headlines.filter(h=>state.feed==='all'||newsFeedsOf(h).includes(state.feed)) : [];
  const feedSources=[...new Set(feedHeadlines.map(h=>h.source).filter(Boolean))].sort();
  const sourceActive = state.source!=='all' && feedSources.includes(state.source);
  const shown = feedHeadlines.filter(h=>{
    if(state.impact==='high'&&h.impact!=='high') return false;
    if(state.impact==='medhigh'&&h.impact==='low') return false;
    if(state.bias!=='all'&&h.bias!==state.bias) return false;
    if(sourceActive&&h.source!==state.source) return false;
    return true;
  });
  const filtersActive = state.impact!=='all'||state.bias!=='all'||sourceActive;
  const passImpact = imp => state.impact==='all' ? true : state.impact==='high' ? imp==='high' : imp!=='low';

  let html='';

  /* ---- header ---- */
  html+=`<div class="head">
    <div>
      <h2>Market News</h2>
      <div class="sub">Live headlines across the desk's markets, each read by VTS AI for bias, impact, and how it could affect our trading — plus Trump's Truth Social posts and the Forex Factory economic calendar (Eastern Time).</div>
    </div>
    <div class="actions">
      <button class="ghostBtn">✨ AI overview</button>
      <button class="${state.feed!=='calendar'?'goldBtn':'ghostBtn'}" data-feed="all">Live market news</button>
      <button class="${state.feed==='calendar'?'goldBtn':'ghostBtn'}" data-feed="calendar">Calendar</button>
    </div>
  </div>`;

  if (S('s-err')) html+=`<div class="banner">Failed to load — click to dismiss.</div>`;

  if (S('s-brief')) html+=`<div class="card brief">
    <div class="eyebrow">AI overview · VTS AI</div>
    <div class="body">${esc(BRIEF_TEXT)}</div>
    <button class="x">×</button>
  </div>`;

  /* ---- filter row ---- */
  html+=`<div class="filters">
    ${dropdown('Feed','feed',state.feed,tabs.map(t=>({v:t.key,l:`${t.label} (${counts[t.key]||0})`})))}
    ${isNewsTab?dropdown('Impact','impact',state.impact,[{v:'all',l:'All'},{v:'medhigh',l:'Medium & up'},{v:'high',l:'High only'}]):''}
    ${isNewsTab?dropdown('Bias','bias',state.bias,[{v:'all',l:'All'},{v:'bullish',l:'Bullish'},{v:'bearish',l:'Bearish'},{v:'neutral',l:'Neutral'}]):''}
    ${isNewsTab&&feedSources.length?dropdown('Source','source',sourceActive?state.source:'all',[{v:'all',l:'All sources'},...feedSources.map(s=>({v:s,l:s}))]):''}
    ${isNewsTab&&filtersActive?`<button class="smallBtn clear" data-clear="1">Clear</button>`:''}
  </div>`;

  /* ---- Trump ---- */
  if(state.feed==='trump'){
    html += truth.length===0
      ? `<div class="card empty">No Truth Social posts yet — the feed mirrors @realDonaldTrump's posts as they land.</div>`
      : `<div class="tlist">`+truth.map(p=>`
          <div class="card tcard">
            <div class="top">
              <span class="who">${esc(p.author)} <span>· @realDonaldTrump</span></span>
              <span class="when">${fmtRelative(p.postedAt)}</span>
            </div>
            <div class="body">${txt(p.content)}</div>
            ${p.url?`<a href="#">View on Truth Social →</a>`:''}
          </div>`).join('')+`</div>`;
  }

  /* ---- Calendar ---- */
  if(state.feed==='calendar'){
    html += calendar.length===0
      ? `<div class="card empty">No events yet — the Forex Factory feed populates within a few minutes.</div>`
      : `<div class="calwrap">${calCol(cal.upcoming,canWrite)}${cal.past.length?`<div class="past"><div class="pastlab">Past</div>${calCol(cal.past,canWrite)}</div>`:''}</div>`;
  }

  /* ---- EUR/USD leads with the calendar, then its headlines ---- */
  if(state.feed==='eurusd'){
    const up=eurCal.upcoming.filter(e=>passImpact(e.impact));
    const pa=eurCal.past.filter(e=>passImpact(e.impact));
    html+=`<div style="margin-bottom:18px">
      <div class="feedLabel">Forex Factory · EUR &amp; USD economic calendar</div>
      ${up.length+pa.length===0
        ? `<div class="card empty" style="padding:22px 20px">No EUR/USD events${filtersActive?' match this filter':' in range yet'} — the Forex Factory feed populates within a few minutes.</div>`
        : `<div class="calwrap">${calCol(up,canWrite)}${pa.length?`<div class="past"><div class="pastlab">Past</div>${calCol(pa,canWrite)}</div>`:''}</div>`}
    </div>`;
  }

  /* ---- headline list ---- */
  if(isNewsTab){
    if(state.feed==='eurusd') html+=`<div class="feedLabel">EUR/USD headlines</div>`;
    if(headlines.length===0){
      html+=`<div class="card empty">No headlines yet — the live news feeds populate within a few minutes.</div>`;
    } else if(shown.length===0){
      html+=`<div class="card empty">${state.feed==='eurusd'?'No EUR/USD headlines match this filter.':'No stories match this filter'+(state.feed!=='all'?' in this feed':'')+'.'} ${filtersActive?'Try clearing the filters.':'Check back shortly.'}</div>`;
    } else {
      html+=`<div class="list">`+shown.map((h,i)=>(S('s-edit')&&i===0)?newsForm():headlineCard(h,canWrite)).join('')+`</div>`;
    }
  }

  well.innerHTML=html;
  wire();
}

function dropdown(label,key,value,options){
  return `<label><span class="lab">${label}</span>
    <select class="input" data-key="${key}">
      ${options.map(o=>`<option value="${esc(o.v)}"${o.v===value?' selected':''}>${esc(o.l)}</option>`).join('')}
    </select></label>`;
}

function headlineCard(h,canWrite){
  const im=IMPACT[h.impact], bi=BIAS[h.bias];
  const affected=affectedInstruments(h,DEFAULT_WATCHLIST);
  return `<div class="hcard" style="border-left:3px solid ${bi.color}">
    <div class="meta">
      <span class="bias" style="color:${bi.color};background:${bi.color}1e;border:1px solid ${bi.color}55">
        <span class="arrow">${bi.arrow}</span>${bi.label}</span>
      <span class="chip" style="color:${im.color};border-color:${im.color}">${im.label} impact</span>
      <span class="chip">${CATEGORY[h.category]}</span>
      ${affected.length?`<span class="affects"><span class="word">affects</span>${affected.slice(0,5).map(s=>`<span class="chip sym">${esc(s)}</span>`).join('')}</span>`:''}
      <span class="when">${fmtRelative(h.publishedAt)}</span>
    </div>
    <div class="title">${txt(h.title)}</div>
    ${h.tradeNote
      ? `<div class="note"><div class="lab" style="color:${bi.color}">How it could affect us</div><div class="txt">${txt(h.tradeNote)}</div></div>`
      : h.body ? `<div class="raw">${txt(h.body)}</div>` : ''}
    <div class="foot">
      ${h.source?`<span class="src">${esc(h.source)}</span>`:''}
      ${h.url?`<a href="#">Source ↗</a>`:''}
      ${canWrite?`<span class="own"><button class="smallBtn">Edit</button><button class="smallBtn del" title="Remove">×</button></span>`:''}
    </div>
  </div>`;
}

function calCol(events,canWrite){
  const groups=[];
  for(const e of events){
    const day=fmtDayKey(e.eventTime);
    const g=groups.find(x=>x.day===day);
    g?g.items.push(e):groups.push({day,items:[e]});
  }
  return `<div class="calcol">`+groups.map(g=>`
    <div>
      <div class="day">${esc(g.day)}</div>
      <div class="rows">${g.items.map(e=>eventRow(e,canWrite)).join('')}</div>
    </div>`).join('')+`</div>`;
}

function eventRow(e,canWrite){
  const im=IMPACT[e.impact];
  return `<div class="erow">
    <span class="dot" style="background:${im.color}"></span>
    <div class="mid">
      <div class="l1">
        <span class="t">${fmtTime(e.eventTime)}</span>
        ${e.country?`<span class="c">${esc(e.country)}</span>`:''}
        <span class="n">${esc(e.title)}</span>
        <span class="chip sym">${esc(e.source||'Forex Factory')}</span>
      </div>
      ${(e.forecast||e.previous||e.actual)?`<div class="figs">
        ${e.actual?`<span>Act <b class="act">${esc(e.actual)}</b></span>`:''}
        ${e.forecast?`<span>Fcst <b>${esc(e.forecast)}</b></span>`:''}
        ${e.previous?`<span>Prev <b>${esc(e.previous)}</b></span>`:''}
      </div>`:''}
      ${e.explainer?`<div class="exp"><i>ⓘ</i><span>${esc(e.explainer)}</span></div>`:''}
    </div>
    ${canWrite?`<span class="own"><button class="smallBtn">Edit</button><button class="smallBtn del" title="Remove">×</button></span>`:''}
  </div>`;
}

/* The inline edit form that REPLACES a headline card when Edit is pressed. */
function newsForm(){
  return `<div class="panel form">
    <div class="lab">Edit headline</div>
    <div class="grid">
      <input class="input" value="Powell says the committee is ‘not on a preset course’ as June PCE cools to 2.4%" placeholder="Headline">
      <textarea class="input" rows="2" placeholder="Detail / context (optional)"></textarea>
      <input class="input half" value="Reuters" placeholder="Source (e.g. Reuters)">
      <input class="input half" value="https://example.com/a" placeholder="Link (https://…)">
      <select class="input fixed"><option>Economic</option></select>
      <select class="input fixed"><option>High impact</option></select>
      <select class="input fixed"><option>Bullish</option></select>
    </div>
    <div class="btns"><button class="goldBtn">Save</button><button class="ghostBtn">Cancel</button></div>
  </div>`;
}

function wire(){
  document.querySelectorAll('[data-key]').forEach(sel=>{
    sel.onchange=e=>{
      const k=sel.dataset.key;
      state[k]=e.target.value;
      if(k==='feed') state.source='all';
      render();
    };
  });
  document.querySelectorAll('[data-feed]').forEach(b=>{
    b.onclick=()=>{state.feed=b.dataset.feed;state.source='all';render();};
  });
  const c=document.querySelector('[data-clear]');
  if(c) c.onclick=()=>{state.impact='all';state.bias='all';state.source='all';render();};
}

document.querySelectorAll('#proto input').forEach(i=>i.addEventListener('change',render));
render();
</script>
